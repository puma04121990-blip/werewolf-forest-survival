<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Оборотень: Лесное Выживание</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b140d;
            font-family: 'Segoe UI', system-ui, sans-serif;
            position: fixed;
            inset: 0;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #0b140d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Важно: НЕ ставим width/height 100% !important —
           это ломает Phaser.Scale.FIT и растягивает картинку
           в портретной ориентации. Phaser сам управляет размером canvas. */
        canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>

    <script>
        function onResize() {
            if (window.game && window.game.scale) {
                window.game.scale.refresh();
            }
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
    </script>
</body>
</html>
