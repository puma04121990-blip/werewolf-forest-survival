<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Оборотень: Лесное Выживание</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b140d;
            font-family: 'Segoe UI', system-ui, sans-serif;
            position: fixed;
            inset: 0;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #0b140d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }

        #boot-status, #boot-error {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            color: #88ffaa;
            font-size: 16px;
            text-align: center;
            padding: 16px 20px;
            max-width: 90vw;
            pointer-events: none;
        }

        #boot-error {
            display: none;
            color: #ff8899;
            background: rgba(20, 0, 0, 0.85);
            border: 1px solid #ff4466;
            border-radius: 8px;
            pointer-events: auto;
            white-space: pre-wrap;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="boot-status">Загрузка леса…</div>
    <div id="boot-error"></div>

    <!-- Phaser first (classic script), then ES modules -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <!-- ?v= busts browser cache after hotfixes -->
    <script type="module" src="src/main.js?v=20260803-levelup4"></script>

    <script>
        // Surface module load failures (otherwise silent black screen)
        window.addEventListener('error', function (e) {
            var box = document.getElementById('boot-error');
            if (!box) return;
            box.style.display = 'block';
            box.textContent = 'JS error: ' + (e.message || e.type) +
                (e.filename ? ('\n' + e.filename + ':' + e.lineno) : '');
        });
        window.addEventListener('unhandledrejection', function (e) {
            var box = document.getElementById('boot-error');
            if (!box) return;
            box.style.display = 'block';
            var r = e.reason;
            box.textContent = 'Module error: ' + (r && r.message ? r.message : String(r));
        });

        function onResize() {
            if (window.game && window.game.scale) {
                window.game.scale.refresh();
            }
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', function () {
            setTimeout(onResize, 120);
        });
    </script>
</body>
</html>
