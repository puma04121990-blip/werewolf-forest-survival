<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <meta name="orientation" content="landscape">
    <title>Оборотень: Лесное Выживание</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b140d;
            font-family: 'Segoe UI', system-ui, sans-serif;
            position: fixed;
            inset: 0;
        }

        /* Основной контейнер игры — всегда на весь экран в landscape */
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #0b140d;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* Оверлей «поверни телефон» — только в портрете */
        #rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0b140d;
            color: #88ffaa;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            gap: 20px;
        }

        #rotate-overlay .icon {
            font-size: 64px;
            animation: rotateHint 1.6s ease-in-out infinite;
        }

        #rotate-overlay h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffe600;
            margin: 0;
        }

        #rotate-overlay p {
            font-size: 15px;
            color: #88bb99;
            max-width: 260px;
            line-height: 1.4;
        }

        @keyframes rotateHint {
            0%, 100% { transform: rotate(0deg); }
            30% { transform: rotate(90deg); }
            70% { transform: rotate(90deg); }
        }

        /* Показываем оверлей в портретной ориентации на мобильных */
        @media screen and (orientation: portrait) and (max-width: 900px) {
            #rotate-overlay {
                display: flex;
            }
            #game-container {
                visibility: hidden;
            }
        }

        @media screen and (orientation: landscape) {
            #rotate-overlay {
                display: none !important;
            }
            #game-container {
                visibility: visible;
            }
        }
    </style>
</head>
<body>
    <!-- Оверлей поворота -->
    <div id="rotate-overlay">
        <div class="icon">📱</div>
        <h2>Поверни телефон</h2>
        <p>Игра работает только в горизонтальной ориентации</p>
    </div>

    <div id="game-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>

    <script>
        // Дополнительная проверка ориентации + resize
        function checkOrientation() {
            const overlay = document.getElementById('rotate-overlay');
            const isPortrait = window.innerHeight > window.innerWidth;
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 900;

            if (isMobile && isPortrait) {
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }

            // Сообщаем Phaser о смене размера
            if (window.game && window.game.scale) {
                window.game.scale.refresh();
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', () => {
            setTimeout(checkOrientation, 150);
        });
        document.addEventListener('DOMContentLoaded', checkOrientation);

        // Попытка заблокировать ориентацию (работает в fullscreen / PWA)
        async function tryLockLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {
                // Браузер может запретить — это нормально
            }
        }
        document.addEventListener('click', tryLockLandscape, { once: true });
        document.addEventListener('touchstart', tryLockLandscape, { once: true });
    </script>
</body>
</html>
